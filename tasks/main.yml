---
- name: Download repo key
  register: gitlab_key_download
  ansible.builtin.get_url:
    url: "https://packages.gitlab.com/gitlab/gitlab-ce/gpgkey"
    dest: "{{ gitlab_keyring }}.asc"
    mode: u=rw,g=r,o=r
    force: true
  tags:
    - gitlab

- name: Check repo key
  register: gitlab_key_status
  ansible.builtin.stat:
    path: "{{ gitlab_keyring }}"
  tags:
    - gitlab

- name: Dearmor repo key
  when:
    - gitlab_key_download.changed or not gitlab_key_status.stat.exists
  register: gitlab_key_convert
  changed_when: gitlab_key_convert.rc == 0
  ansible.builtin.command:
    cmd: "gpg --batch --yes --dearmor -o {{ gitlab_keyring }} {{ gitlab_keyring }}.asc"
  tags:
    - gitlab

- name: Add apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ gitlab_keyring }}] https://packages.gitlab.com/gitlab/gitlab-ce/ubuntu/ {{ ansible_facts['distribution_release'] }} main"
    filename: gitlab
    update_cache: true
    state: present
  tags:
    - gitlab

- name: Pin package version
  ansible.builtin.copy:
    content: |
      Explantion: Pin added by gitlab role
      Package: gitlab-ce
      Pin: version {{ gitlab_version }}*
      Pin-Priority: 1000
    dest: /etc/apt/preferences.d/gitlab
    owner: root
    group: root
    mode: u=rw,g=r,o=r
  tags:
    - gitlab

- name: Install required packages
  loop:
    - curl
    - openssl
    - tzdata
    - "gitlab-ce={{ gitlab_version }}*"
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  tags:
    - gitlab

- name: Initial reconfigure run
  failed_when: false
  ansible.builtin.command:
    cmd: gitlab-ctl reconfigure
    creates: /var/opt/gitlab/bootstrapped
  tags:
    - gitlab

- name: Write config template
  notify:
    - Restart gitlab
  ansible.builtin.template:
    src: gitlab.j2
    dest: /etc/gitlab/gitlab.rb
    owner: root
    group: root
    mode: u=rw,g=,o=
  tags:
    - gitlab

- name: Create daily cronjob
  ansible.builtin.cron:
    name: daily
    cron_file: gitlab
    minute: "{{ gitlab_prune_daily_minute }}"
    hour: "{{ gitlab_prune_daily_hour }}"
    day: "{{ gitlab_prune_daily_day }}"
    month: "{{ gitlab_prune_daily_month }}"
    weekday: "{{ gitlab_prune_daily_weekday }}"
    job: "{{ gitlab_prune_daily_job }}"
    user: root
    state: "{{ 'present' if gitlab_prune_daily_enabled else 'absent' }}"
  tags:
    - gitlab

- name: Write daily prune
  when:
    - gitlab_prune_daily_enabled
  ansible.builtin.template:
    src: prune/daily.j2
    dest: "{{ gitlab_prune_daily_path }}"
    owner: root
    group: root
    mode: u=rwx,g=,o=
  tags:
    - gitlab

- name: Remove daily prune
  when:
    - not gitlab_prune_daily_enabled
  ansible.builtin.file:
    path: "{{ gitlab_prune_daily_path }}"
    state: absent
  tags:
    - gitlab

